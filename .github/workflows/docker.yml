name: Docker build

on:
  push:
    branches: [main]
    paths: &docker_paths
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "docker-compose*.yml"
      - "backend/requirements*.txt"
      - "frontend/package*.json"
      - "infra/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths: *docker_paths
  schedule:
    # Weekly CVE scan of base images, OS packages, and application lockfiles.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compose build & image security scan
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: jobprep
    steps:
      - uses: actions/checkout@v4
      # Compose's ${VAR} interpolation reads .env.
      - run: cp .env.example .env
      - name: Validate compose (dev = base + override, and production)
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet
      - name: Validate nginx config
        # Upstream hosts only need to resolve; nginx -t doesn't connect.
        run: >
          docker run --rm
          --tmpfs /etc/nginx/conf.d:size=4m
          --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1
          -e SERVER_NAME=localhost -e 'NGINX_ENVSUBST_FILTER=^SERVER_NAME$'
          -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro"
          -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro"
          nginx:alpine /docker-entrypoint.sh nginx -t
      - name: Build production backend and frontend images
        run: docker compose -f docker-compose.yml build backend frontend
      - name: Scan repository files with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan built backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'jobprep-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan built frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'jobprep-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
