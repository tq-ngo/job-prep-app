worker_processes auto;

events {
    worker_connections 2048;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────────
    # text/event-stream is deliberately NOT listed (gzip buffers SSE).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml text/x-component;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Edge rate limits ─────────────────────────────────────────────────
    # Behind a trusted load balancer / CDN, uncomment set_real_ip_from in
    # your server block (see tls.conf.example) so $binary_remote_addr keys
    # on the real client IP rather than the proxy IP.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=health:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
