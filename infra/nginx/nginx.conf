events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────────
    # Was off entirely: JSON job pages and the HTML/JS/CSS went out raw.
    # text/event-stream is deliberately NOT listed (gzip buffers SSE).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml text/x-component;

    # Only send "Connection: upgrade" when the client actually asked for an
    # upgrade; it used to be forced on every request proxied to Next.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Edge rate limits ─────────────────────────────────────────────────
    # In front of the app's own slowapi limits (per-route, Redis-backed).
    # Keyed on the peer address. Behind a load balancer or CDN, every client
    # shares the balancer's address (and under Docker Desktop's port proxy,
    # the bridge gateway's); see tls.conf.example for set_real_ip_from.
    #
    # auth: was 10r/s with burst 20, ~600 attempts a minute per address.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # Everything else under /api/; generous for a UI that pages and polls.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Concurrent long-lived SSE connections per address.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # Server blocks live in templates/default.conf.template, rendered into
    # conf.d/ at container start with SERVER_NAME substituted.
    include /etc/nginx/conf.d/*.conf;
}
