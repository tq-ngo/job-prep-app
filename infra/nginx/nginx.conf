events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;

    # ── Compression ──────────────────────────────────────────────────────
    # Was off entirely: JSON job pages and the HTML/JS/CSS went out raw.
    # text/event-stream is deliberately NOT listed (gzip buffers SSE).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml text/x-component;

    # Only send "Connection: upgrade" when the client actually asked for an
    # upgrade; it used to be forced on every request proxied to Next.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Edge throttle for auth endpoints, in front of the app's own slowapi
    # limits (which are per-route and Redis-backed).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Security headers (all responses, including errors) ──────────
        # script-src needs 'unsafe-inline' for Next's inline RSC payloads
        # and the pre-paint theme script; everything else is same-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # Enable once served over HTTPS (it is ignored on plain HTTP):
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Shared proxy headers. X-Forwarded-For is OVERWRITTEN with the real
        # peer, not appended to ($proxy_add_x_forwarded_for): this nginx is
        # the edge, so any inbound value is client-supplied and was being
        # used to dodge rate limits.
        #
        # All proxy_set_header directives live HERE and none in locations:
        # nginx only inherits them into a location that sets none of its
        # own, so a single per-location header silently drops the rest.
        # $connection_upgrade is '' for ordinary requests (enabling upstream
        # keepalive) and "upgrade" only for real WebSocket upgrades.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE streaming routes → FastAPI backend (must come BEFORE /api/)
        location /api/v1/stream/ {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 75s;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
        }

        # API routes → FastAPI backend
        location /api/ {
            proxy_pass http://backend;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check → FastAPI
        location = /health {
            proxy_pass http://backend;
        }

        # API docs → FastAPI, private networks only. They were public,
        # advertising every route and schema to anyone.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend;
        }

        # Everything else → Next.js frontend
        location / {
            proxy_pass http://frontend;
        }
    }
}
