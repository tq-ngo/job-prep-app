# Shared proxy headers and locations included by both the plain-HTTP template
# and tls.conf.example so routes and hardening rules cannot drift.

proxy_hide_header X-Powered-By;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# JSON 429 response for API rate-limit rejections (instead of default nginx HTML).
location @rate_limit_json {
    default_type application/json;
    return 429 '{"detail":"Rate limit exceeded"}';
}

# SSE streaming routes -> FastAPI backend (must come BEFORE /api/)
location /api/v1/stream/ {
    limit_conn perip 5;
    error_page 429 = @rate_limit_json;
    proxy_pass http://backend;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 86400s;
    proxy_connect_timeout 75s;
}

location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    error_page 429 = @rate_limit_json;
    proxy_pass http://backend;
    proxy_read_timeout 60s;
}

# API routes -> FastAPI backend
location /api/ {
    limit_req zone=api burst=60 nodelay;
    error_page 429 = @rate_limit_json;
    proxy_pass http://backend;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}

# nginx's own container healthcheck
location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}

# Health check -> FastAPI (rate-limited)
location = /health {
    limit_req zone=health burst=20 nodelay;
    proxy_pass http://backend;
}

# API docs are never served publicly
location ~ ^/(docs|redoc|openapi\.json)$ {
    return 404;
}

# Everything else -> Next.js frontend
location / {
    proxy_pass http://frontend;
}
