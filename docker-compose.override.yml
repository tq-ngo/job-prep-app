# Local development layer, merged automatically by `docker compose up`.
# Adds what production must not have: host ports on loopback for local
# tools, source bind-mounts with auto-reload, and Flower.
# Production: `docker compose -f docker-compose.yml up -d` skips this file.

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    read_only: false
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--reload"]

  celery-worker-scraping:
    read_only: false
    volumes:
      - ./backend:/app

  celery-worker-ai:
    read_only: false
    volumes:
      - ./backend:/app

  celery-beat:
    read_only: false
    volumes:
      - ./backend:/app

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ENABLE_API_REWRITES: "true"

  celery-flower:
    image: mher/flower:2.0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [data, edge]
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH in .env (user:password)}
      FLOWER_PORT: "5555"
    command: ["celery", "flower"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      celery-worker-scraping:
        condition: service_healthy
