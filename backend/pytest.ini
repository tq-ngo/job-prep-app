[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
pythonpath = .
markers =
    unit: Fast in-memory unit tests
    integration: Tests requiring database or mocked network services
    pipeline: Celery and crawler pipeline tests

