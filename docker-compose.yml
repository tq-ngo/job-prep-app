services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job-prep-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job-prep-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-prep-backend
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run here (single owner) before uvicorn starts. Celery
    # services deliberately do NOT migrate, to avoid concurrent upgrades.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-prep-celery-worker
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,scraping,ai

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-prep-celery-beat
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    command: celery -A app.tasks.celery_app beat --loglevel=info

  celery-flower:
    image: mher/flower:2.0
    container_name: job-prep-flower
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:jobprep2026}
    ports:
      - "127.0.0.1:5555:5555"
    command: celery --broker=${CELERY_BROKER_URL} flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:jobprep2026}
    depends_on:
      - celery-worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at BUILD time (see frontend/Dockerfile).
        # Empty = same-origin (relative /api/... behind nginx), the supported setup
        # so SameSite=Lax auth cookies work without cross-site issues.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: job-prep-frontend
    environment:
      # Server-side only (RSC / route handlers), resolved on the compose network.
      - INTERNAL_API_URL=http://backend:8000
      - JWT_SECRET=${SECRET_KEY}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: job-prep-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: