# Production-shaped stack: only nginx publishes a port, nothing is
# bind-mounted, networks are segmented (edge / internal data / egress),
# and secrets are scoped strictly to the services that need them.
# Local development layers docker-compose.override.yml automatically
# (`docker compose up`); deploy with `docker compose -f docker-compose.yml up -d`.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    shm_size: 256m
    stop_grace_period: 30s
    networks: [data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    cap_add:
      - SETGID
      - SETUID
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s
    networks: [data]
    # Durable state & queue Redis: holds JWT denylist/family revocations, OAuth
    # state, locks, SSE stream, and Celery broker/backend with noeviction.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    cap_add:
      - SETGID
      - SETUID
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s
    networks: [data]
    # Evictable cache Redis: holds jobs_count, popular_skills, public:stats,
    # query embeddings, user profile cache, and dedup ZSETs with LRU eviction.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    <<: [*backend-build, *hardening]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks: [data]
    environment:
      SERVICE_ROLE: migrate
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: [*backend-build, *hardening]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    networks: [edge, data, egress]
    environment:
      SERVICE_ROLE: api
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/v1/auth/google/callback}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-4}
      GEMINI_RATE_LIMIT: ${GEMINI_RATE_LIMIT:-2/m}
      # Trust X-Forwarded-* only from nginx (fixed address on edge network).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--timeout-graceful-shutdown", "25"]

  celery-worker-scraping:
    <<: [*backend-build, *hardening]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 60s
    networks: [data, egress]
    # Scoped env: no SECRET_KEY, GOOGLE_CLIENT_SECRET, or GEMINI_API_KEY.
    environment:
      SERVICE_ROLE: worker
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
      LINKEDIN_LI_AT: ${LINKEDIN_LI_AT:-}
      GEMINI_RATE_LIMIT: ${GEMINI_RATE_LIMIT:-2/m}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=3", "--max-tasks-per-child=100", "-Q", "scraping,default", "-n", "scraping@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d scraping@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  celery-worker-ai:
    <<: [*backend-build, *hardening]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 60s
    networks: [data, egress]
    # Scoped env: Gemini credentials only; no SECRET_KEY, OAuth secret, or LINKEDIN_LI_AT.
    environment:
      SERVICE_ROLE: worker
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_RATE_LIMIT: ${GEMINI_RATE_LIMIT:-2/m}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--max-tasks-per-child=100", "-Q", "ai", "-n", "ai@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d ai@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: [*backend-build, *hardening]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s
    networks: [data]
    # Scoped env: scheduler needs only DB/Redis/broker URLs — zero auth, OAuth, AI, or scrape secrets.
    environment:
      SERVICE_ROLE: worker
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?set CELERY_BROKER_URL in .env}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?set CELERY_RESULT_BACKEND in .env}
      GEMINI_RATE_LIMIT: ${GEMINI_RATE_LIMIT:-2/m}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-4}
    volumes:
      - celerybeat_data:/var/lib/celery
    depends_on:
      migrate:
        condition: service_completed_successfully
      celery-worker-scraping:
        condition: service_healthy
      celery-worker-ai:
        condition: service_healthy
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info", "--schedule", "/var/lib/celery/celerybeat-schedule"]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; ok = any(p.name.isdigit() and 'beat' in (p / 'cmdline').read_bytes().decode('utf-8', 'ignore') for p in pathlib.Path('/proc').iterdir()); raise SystemExit(0 if ok else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        SITE_URL: ${SITE_URL:-http://localhost}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    networks: [edge]
    environment:
      INTERNAL_API_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-http://localhost}
      JWT_SECRET: ${SECRET_KEY:?set SECRET_KEY in .env}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /etc/nginx/conf.d:size=4m
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 15s
    networks:
      edge:
        # Fixed so the backend trusts exactly this address for X-Forwarded-For.
        ipv4_address: 172.30.0.10
    ports:
      - "80:80"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost 127.0.0.1}
      NGINX_ENVSUBST_FILTER: "^SERVER_NAME$$"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
